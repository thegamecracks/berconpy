name: Lint and test

on:
  push:
    paths:
      - src/**
      - tests/**
      - pyproject.toml
      - uv.lock

jobs:
  pyright:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      - run: uvx ty check --output-format github
      - run: uvx pyright --pythonpath .venv/bin/python

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      - run: uv run -m pytest
